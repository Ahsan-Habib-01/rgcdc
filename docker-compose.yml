version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: rgcdc_admin
      POSTGRES_PASSWORD: rgcdc_secure_password_2026
      POSTGRES_DB: rgcdc_calicotab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://rgcdc_admin:rgcdc_secure_password_2026@db:5432/rgcdc_calicotab
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
