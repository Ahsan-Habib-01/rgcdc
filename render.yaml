services:
  - type: web
    name: rgcdc-calicotab-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rgcdc-postgres-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: rgcdc-postgres-db
    plan: free
    databaseName: rgcdc_calicotab
    user: rgcdc_admin
